<style>
  .stage { padding: 24px 16px 48px; display: grid; gap: var(--space-6); }
  .frame { display: grid; gap: var(--space-2); }
  .frame-label { font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: .14em; color: hsl(var(--muted-foreground)); text-transform: uppercase; }

  .series {
    border: 1px solid hsl(var(--border));
    background: hsl(var(--card));
    border-radius: var(--radius-lg);
    padding: 14px 16px 10px;
  }
  .s-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
  .s-badge {
    font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 600;
    letter-spacing: .18em;
    color: hsl(var(--primary));
    background: hsl(var(--primary) / .1);
    border: 1px solid hsl(var(--primary) / .25);
    border-radius: var(--radius-full);
    padding: 1px 9px;
  }
  .s-name { font-size: 14px; font-weight: 600; }
  .s-count { margin-left: auto; font-family: var(--font-mono); font-size: var(--text-xs); color: hsl(var(--muted-foreground)); font-variant-numeric: tabular-nums; }
  .s-count b { color: hsl(var(--primary)); font-weight: 600; }

  .s-dots { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; margin-top: 10px; }
  .s-dots a, .s-dots span.dot {
    min-width: 24px; height: 24px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .s-dots a i, .s-dots span.dot i {
    width: 12px; height: 4px; border-radius: 2px;
    background: hsl(var(--muted-foreground) / .32);
  }
  .s-dots a.done i { background: hsl(var(--primary) / .45); }
  .s-dots span.dot.cur i { height: 7px; width: 18px; background: hsl(var(--primary)); box-shadow: 0 0 10px hsl(var(--primary) / .45); }
  .s-dots .fade i { opacity: .35; }

  .s-nav { border-top: 1px solid hsl(var(--border)); margin-top: 10px; padding-top: 4px; display: grid; }
  .s-nav a { display: block; min-height: 44px; padding: 6px 0; }
  .s-nav a + a { border-top: 1px dashed hsl(var(--border)); }
  .s-nav .lab { font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: .14em; color: hsl(var(--muted-foreground)); }
  .s-nav .ttl { font-size: 13.5px; line-height: 1.45; margin-top: 1px; color: hsl(var(--foreground)); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .s-nav .arrow { color: hsl(var(--primary)); font-family: var(--font-mono); }
</style>
